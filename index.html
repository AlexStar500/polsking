<style>
:root {
  --bg: #f7f7f7; --app-bg: #fff; --text: #4b4b4b; --text-muted: #888; --border: #e5e5e5;
  --primary: #c8102e; --primary-dark: #8b0a1f; --primary-light: #fff5f7;
  --success: #58cc02; --success-dark: #4aa800; --success-bg: #ebffdc;
  --error: #ff4b4b; --error-dark: #d03030; --error-bg: #ffecec;
  --gold: #ffc800; --gold-dark: #d1a200; --gold-bg: #fff9e6;
  --shadow: rgba(0,0,0,0.05);
}
[data-theme="dark"] {
  --bg: #131f24; --app-bg: #1a2930; --text: #f1f7fb; --text-muted: #8fa3b0; --border: #37464f;
  --primary: #ff4b4b; --primary-dark: #b52b2b; --primary-light: #2a1a1a;
  --success: #58cc02; --success-dark: #4aa800; --success-bg: #1e3311;
  --error: #ff4b4b; --error-dark: #d03030; --error-bg: #331a1a;
  --gold: #ffc800; --gold-dark: #d1a200; --gold-bg: #2e260a;
  --shadow: rgba(0,0,0,0.3);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: 'Nunito', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; transition: background 0.3s, color 0.3s; }
.app { max-width: 600px; margin: 0 auto; min-height: 100vh; background: var(--app-bg); box-shadow: 0 0 40px var(--shadow); transition: background 0.3s; display: flex; flex-direction: column; }
button { font-family: inherit; }

/* ── язык ── */
.lang-screen { padding: 40px 24px; text-align: center; flex: 1; display: flex; flex-direction: column; justify-content: center; }
.mascot { width: 140px; height: 140px; margin: 16px auto 24px; display: block; }
.brand { font-size: 36px; font-weight: 900; color: var(--primary); letter-spacing: -1px; }
.brand-sub { color: var(--text-muted); margin-top: 6px; font-weight: 600; }
.lang-options { display: flex; flex-direction: column; gap: 12px; max-width: 340px; margin: 32px auto 16px; width: 100%; }
.lang-btn { display: flex; align-items: center; gap: 14px; padding: 16px 18px; border: 2px solid var(--border); background: var(--app-bg); border-radius: 16px; font-weight: 700; font-size: 16px; cursor: pointer; box-shadow: 0 4px 0 var(--border); color: var(--text); width: 100%; transition: transform 0.1s; }
.lang-btn:hover { background: var(--bg); }
.lang-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--border); }
.lang-btn img { width: 38px; border-radius: 4px; }

/* ── топ-бар ── */
.top-bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 2px solid var(--border); position: sticky; top: 0; background: var(--app-bg); z-index: 10; transition: background 0.3s; }
.brand-small { display: flex; align-items: center; gap: 8px; font-weight: 900; color: var(--primary); font-size: 18px; }
.top-actions { display: flex; align-items: center; gap: 12px; }
.icon-btn { background: none; border: none; cursor: pointer; padding: 4px; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: var(--text-muted); }
.icon-btn:hover { background: var(--bg); color: var(--text); }
.lang-switch { display: flex; align-items: center; gap: 6px; background: var(--bg); padding: 6px 12px; border-radius: 12px; font-weight: 800; cursor: pointer; border: 2px solid var(--border); color: var(--text); }
.lang-switch img { width: 20px; border-radius: 2px; }
.top-stats { display: flex; gap: 16px; }
.stat { display: flex; align-items: center; gap: 5px; font-weight: 800; color: var(--text-muted); font-size: 15px; }
.stat img { width: 22px; height: 22px; }

/* ── карта ── */
.map-screen { padding: 16px; flex: 1; overflow-y: auto; }
.unit-header { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: #fff; padding: 16px 22px; border-radius: 18px; margin: 22px 0 8px; font-weight: 900; font-size: 18px; box-shadow: 0 4px 0 var(--primary-dark); }
.unit-header small { display: block; font-weight: 700; opacity: 0.8; font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 3px; }
.lessons-path { display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 16px 0 24px; }
.lesson-item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
@media (min-width: 400px) { .lesson-item:nth-child(4n+1) { transform: translateX(-40px); } .lesson-item:nth-child(4n+3) { transform: translateX(40px); } }
.lesson-btn { width: 78px; height: 78px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 0 rgba(0,0,0,0.18); transition: transform 0.1s; }
.lesson-btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,0.18); }
.lesson-btn.locked { background: var(--border); box-shadow: 0 6px 0 rgba(0,0,0,0.1); cursor: not-allowed; }
.lesson-btn.available { background: var(--primary); color: #fff; }
.lesson-btn.completed { background: var(--gold); box-shadow: 0 6px 0 var(--gold-dark); }
.lesson-btn svg, .lesson-btn img { width: 34px; height: 34px; }
.lesson-label { font-size: 12px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; text-align: center; max-width: 100px; }

/* ── урок ── */
.lesson-screen { padding: 16px 20px; min-height: 100vh; display: flex; flex-direction: column; }
.lesson-top { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
.progress-bar { flex: 1; height: 16px; background: var(--border); border-radius: 8px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--gold); transition: width 0.35s; border-radius: 8px; }
.close-btn { background: none; border: none; font-size: 26px; cursor: pointer; color: var(--text-muted); padding: 0 8px; }
.close-btn:hover { color: var(--text); }
.lesson-content { flex: 1; }
.prompt-label { font-size: 12px; text-transform: uppercase; color: var(--text-muted); font-weight: 800; letter-spacing: 1.2px; margin-bottom: 12px; }
.prompt { font-size: 26px; font-weight: 900; margin-bottom: 12px; color: var(--text); }

.options { display: flex; flex-direction: column; gap: 12px; margin: 20px 0; }
.option-btn { padding: 16px 20px; border: 2px solid var(--border); background: var(--app-bg); border-radius: 14px; text-align: left; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 3px 0 var(--border); color: var(--text); transition: transform 0.08s; }
.option-btn:hover:not(:disabled) { background: var(--bg); }
.option-btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--border); }
.option-btn.selected { border-color: var(--primary); background: var(--primary-light); color: var(--primary); box-shadow: 0 3px 0 var(--primary); }
.option-btn.correct { border-color: var(--success); background: var(--success-bg); color: var(--success-dark); box-shadow: 0 3px 0 var(--success); }
.option-btn.wrong { border-color: var(--error); background: var(--error-bg); color: var(--error-dark); box-shadow: 0 3px 0 var(--error); }

.translate-area { min-height: 90px; border-bottom: 2px solid var(--border); padding: 10px 0; display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
.translate-area .placeholder { color: var(--text-muted); font-weight: 600; padding: 8px 0; opacity: 0.5; }
.bank { display: flex; flex-wrap: wrap; gap: 8px; }
.word-btn { padding: 10px 16px; border: 2px solid var(--border); background: var(--app-bg); border-radius: 12px; font-weight: 700; font-size: 16px; cursor: pointer; box-shadow: 0 3px 0 var(--border); color: var(--text); }
.word-btn:hover:not(:disabled) { background: var(--bg); }
.word-btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--border); }
.word-btn.used { opacity: 0.25; pointer-events: none; box-shadow: none; }
.word-btn.in-answer { border-color: var(--primary); color: var(--primary); background: var(--primary-light); box-shadow: 0 3px 0 var(--primary); }

/* ── input ── */
.input-area { display: flex; flex-direction: column; gap: 12px; margin: 20px 0; }
.text-input { width: 100%; padding: 16px 20px; border: 2px solid var(--border); background: var(--app-bg); border-radius: 14px; font-size: 18px; font-weight: 700; color: var(--text); outline: none; transition: border-color 0.2s; }
.text-input:focus { border-color: var(--primary); }
.text-input.correct { border-color: var(--success); color: var(--success-dark); background: var(--success-bg); }
.text-input.wrong { border-color: var(--error); color: var(--error-dark); background: var(--error-bg); }
.input-hint { font-size: 14px; color: var(--text-muted); font-weight: 600; }

/* ── match ── */
.match-grid { display: flex; gap: 16px; margin: 20px 0; }
.match-col { flex: 1; display: flex; flex-direction: column; gap: 10px; }
.match-btn { padding: 14px 16px; border: 2px solid var(--border); background: var(--app-bg); border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; box-shadow: 0 3px 0 var(--border); color: var(--text); text-align: center; transition: all 0.1s; }
.match-btn.selected { border-color: var(--primary); background: var(--primary-light); color: var(--primary); box-shadow: 0 3px 0 var(--primary); }
.match-btn.matched { border-color: var(--success); background: var(--success-bg); color: var(--success-dark); box-shadow: 0 3px 0 var(--success); opacity: 0.5; pointer-events: none; }
.match-btn.wrong-match { border-color: var(--error); background: var(--error-bg); color: var(--error-dark); }

/* ── футер-фидбек ── */
.feedback { padding: 16px 20px; border-top: 2px solid var(--border); background: var(--app-bg); position: sticky; bottom: 0; margin: 20px -20px -16px; transition: background 0.3s; }
.feedback.correct-bg { background: var(--success-bg); border-top-color: var(--success); }
.feedback.wrong-bg { background: var(--error-bg); border-top-color: var(--error); }
.feedback-msg { font-weight: 900; font-size: 20px; margin-bottom: 8px; }
.feedback-msg.correct { color: var(--success-dark); }
.feedback-msg.wrong { color: var(--error-dark); }
.feedback-answer { color: var(--text); margin-bottom: 14px; font-size: 15px; font-weight: 600; opacity: 0.8; }
.feedback-answer b { color: var(--text); }
.btn { padding: 14px 24px; border-radius: 14px; border: none; font-weight: 900; font-size: 15px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: transform 0.08s; }
.btn:active:not(:disabled) { transform: translateY(2px); }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: #fff; box-shadow: 0 4px 0 var(--primary-dark); }
.btn-primary:active:not(:disabled) { box-shadow: 0 2px 0 var(--primary-dark); }
.btn-secondary { background: var(--app-bg); color: var(--primary); border: 2px solid var(--border); box-shadow: 0 4px 0 var(--border); }
.btn-check { width: 100%; }

/* ── результат ── */
.result-screen { padding: 48px 24px; text-align: center; flex: 1; display: flex; flex-direction: column; justify-content: center; }
.result-screen h1 { font-size: 30px; color: var(--gold); margin: 8px 0 16px; }
.result-screen.fail h1 { color: var(--primary); }
.result-sub { color: var(--text-muted); font-weight: 600; }
.result-stats { display: flex; justify-content: center; gap: 20px; margin: 28px 0; }
.result-stat { flex: 1; max-width: 130px; padding: 18px 10px; border-radius: 16px; background: var(--bg); border: 2px solid var(--gold); }
.result-stat-label { font-size: 11px; color: var(--text-muted); font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
.result-stat-value { font-size: 26px; font-weight: 900; color: var(--gold-dark); }
</style>
</head>

function t(k) { return T[state.lang || 'ru'][k]; }

function saveProgress() { localStorage.setItem('polsking', JSON.stringify(progress)); }
function norm(s) { return s.toLowerCase().replace(/[.,!?;:'"„”«»()]/g, '').replace(/\s+/g, ' ').trim(); }

function playSound(ok) {
  const id = ok ? 'sfx-apply' : 'sfx-deny';
  const audio = document.getElementById(id);
  if (audio) { audio.currentTime = 0; audio.play().catch(() => {}); }
}

function applyTheme() {
  document.documentElement.setAttribute('data-theme', progress.theme || 'light');
}

/* ══════════════════ РЕНДЕР ══════════════════ */
function render() {
  applyTheme();
  const el = document.getElementById('app');
  if (state.view === 'lang')   { el.innerHTML = renderLang(); bindLang(); }
  else if (state.view === 'map')    { el.innerHTML = renderMap(); bindMap(); }
  else if (state.view === 'lesson') { el.innerHTML = renderLesson(); bindLesson(); }
  else if (state.view === 'result') { el.innerHTML = renderResult(); bindResult(); }
}

function renderLang() {
  return `
    <div class="lang-screen">
      <img class="mascot" src="${IMAGES.eagle}" alt="Polsking">
      <h1 class="brand">Polsking</h1>
      <p class="brand-sub">Учи польский · Learn Polish</p>
      <div class="lang-options">
        <button class="lang-btn" data-lang="ru">
          <img src="${IMAGES.flag_ru}" alt=""><span>Я говорю по-русски</span>
        </button>
        <button class="lang-btn" data-lang="en">
          <img src="${IMAGES.flag_gb}" alt=""><span>I speak English</span>
        </button>
      </div>
      ${progress.lang ? `<button class="btn btn-secondary" data-action="continue-saved">${T[progress.lang].continueSaved}</button>` : ''}
    </div>
  `;
}
function bindLang() {
  document.querySelectorAll('.lang-btn').forEach(b => b.onclick = () => {
    state.lang = b.dataset.lang; progress.lang = state.lang; saveProgress(); state.view = 'map'; render();
  });
  const c = document.querySelector('[data-action="continue-saved"]');
  if (c) c.onclick = () => { state.lang = progress.lang; state.view = 'map'; render(); };
}

function renderMap() {
  const course = COURSES[state.lang];
  let html = `<div class="map-screen">`;
  html += `
    <div class="top-bar">
      <div class="brand-small"><img src="${IMAGES.eagle}" style="width:30px;height:30px">Polsking</div>
      <div class="top-actions">
        <button class="lang-switch" onclick="toggleLang()">
          <img src="${state.lang === 'ru' ? IMAGES.flag_ru : IMAGES.flag_gb}">
          ${state.lang.toUpperCase()}
        </button>
        <button class="icon-btn" onclick="toggleTheme()">
          ${progress.theme === 'dark' ? '☀️' : '🌙'}
        </button>
      </div>
      <div class="top-stats"><div class="stat"><img src="${IMAGES.star}">${progress.xp}</div></div>
    </div>`;
  course.units.forEach((unit, ui) => {
    html += `<div class="unit-header"><small>${t('unit')} ${ui + 1}</small>${unit.title}</div>`;
    html += `<div class="lessons-path">`;
    unit.lessons.forEach((lesson, li) => {
      const key = state.lang + '_' + ui + '-' + li;
      const completed = !!progress.completed[key];
      const unlocked = isUnlocked(ui, li);
      const cls = completed ? 'completed' : (unlocked ? 'available' : 'locked');
      let inner = completed ? `<span style="font-size:32px;color:#fff;font-weight:900">✓</span>` : (unlocked ? `<span style="font-size:30px;color:#fff;font-weight:900">▶</span>` : `<span style="font-size:24px;color:var(--text-muted)">🔒</span>`);
      html += `<div class="lesson-item"><button class="lesson-btn ${cls}" data-u="${ui}" data-l="${li}" ${unlocked ? '' : 'disabled'}>${inner}</button><div class="lesson-label">${lesson.title}</div></div>`;
    });
    html += `</div>`;
  });
  html += `</div>`;
  return html;
}
function isUnlocked(ui, li) {
  if (ui === 0 && li === 0) return true;
  const key = (u, l) => state.lang + '_' + u + '-' + l;
  if (li > 0) return !!progress.completed[key(ui, li - 1)];
  const prev = COURSES[state.lang].units[ui - 1];
  return prev.lessons.every((_, i) => !!progress.completed[key(ui - 1, i)]);
}
function bindMap() {
  document.querySelectorAll('.lesson-btn[data-u]').forEach(b => {
    if (!b.disabled) b.onclick = () => startLesson(+b.dataset.u, +b.dataset.l);
  });
}
function toggleLang() {
  state.lang = state.lang === 'ru' ? 'en' : 'ru';
  progress.lang = state.lang; saveProgress(); render();
}
function toggleTheme() {
  progress.theme = progress.theme === 'dark' ? 'light' : 'dark';
  saveProgress(); render();
}

function startLesson(ui, li) {
  state.unitIdx = ui; state.lessonIdx = li;
  state.exercises = COURSES[state.lang].units[ui].lessons[li].exercises;
  state.exIdx = 0; state.hearts = 5; state.lessonXp = 0; state.xpGained = 0;
  state.failed = false; state.selected = null; state.answer = []; state.inputValue = ''; state.result = null;
  state.matchSelected = null; state.matchMatched = [];
  state.view = 'lesson';
  render();
}

function renderLesson() {
  const ex = state.exercises[state.exIdx];
  const pct = (state.exIdx / state.exercises.length) * 100;
  let body = '';
  if (ex.type === 'choice') body = renderChoice(ex);
  else if (ex.type === 'translate') body = renderTranslate(ex);
  else if (ex.type === 'input') body = renderInput(ex);
  else if (ex.type === 'match') body = renderMatch(ex);
  return `
    <div class="lesson-screen">
      <div class="lesson-top">
        <button class="close-btn" data-action="quit">✕</button>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="stat"><img src="${IMAGES.heart}" style="width:22px;height:22px"> ${state.hearts}</div>
      </div>
      <div class="lesson-content">${body}</div>
      ${renderFooter(ex)}
    </div>
  `;
}

function renderChoice(ex) {
  const r = state.result, sel = state.selected;
  const opts = ex.options.map((o, i) => {
    let cls = 'option-btn';
    if (r) { if (o === ex.answer) cls += ' correct'; else if (i === sel) cls += ' wrong'; }
    else if (i === sel) cls += ' selected';
    return `<button class="${cls}" data-opt="${i}" ${r ? 'disabled' : ''}>${o}</button>`;
  }).join('');
  return `<div class="prompt-label">${t('chooseTranslation')}</div><div class="prompt">${ex.prompt}</div><div class="options">${opts}</div>`;
}

function renderTranslate(ex) {
  const r = state.result, ans = state.answer || [];
  const bank = ex.bank || ex.answer.split(' ');
  const used = new Set(ans.map(a => a.i));
  const answerHtml = ans.length === 0
    ? `<span class="placeholder">${t('placeholder')}</span>`
    : ans.map((a, ai) => `<button class="word-btn in-answer" data-ans="${ai}" ${r ? 'disabled' : ''}>${a.w}</button>`).join('');
  const bankHtml = bank.map((w, i) => `<button class="word-btn ${used.has(i) ? 'used' : ''}" data-bank="${i}" ${r ? 'disabled' : ''}>${w}</button>`).join('');
  return `<div class="prompt-label">${t('translateTo')}</div><div class="prompt">${ex.prompt}</div><div class="translate-area">${answerHtml}</div><div class="bank">${bankHtml}</div>`;
}

function renderInput(ex) {
  const r = state.result;
  let cls = 'text-input';
  if (r === 'correct') cls += ' correct';
  if (r === 'wrong') cls += ' wrong';
  return `
    <div class="prompt-label">${t('typeAnswer')}</div>
    <div class="prompt">${ex.prompt}</div>
    <div class="input-hint">${t('hint')}: <b>${ex.hint}</b></div>
    <div class="input-area">
      <input type="text" class="${cls}" id="input-field" value="${state.inputValue || ''}" placeholder="${t('placeholder')}" ${r ? 'disabled' : ''} autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    </div>`;
}

function renderMatch(ex) {
  const r = state.result;
  const left = ex.pairs.map((p, i) => {
    let cls = 'match-btn';
    if (state.matchMatched.includes(i)) cls += ' matched';
    else if (state.matchSelected === i) cls += ' selected';
    return `<button class="${cls}" data-match="${i}" data-side="left" ${r ? 'disabled' : ''}>${p[0]}</button>`;
  }).join('');
  const right = ex.pairs.map((p, i) => {
    let cls = 'match-btn';
    if (state.matchMatched.includes(i)) cls += ' matched';
    return `<button class="${cls}" data-match="${i}" data-side="right" ${r ? 'disabled' : ''}>${p[1]}</button>`;
  }).sort(() => Math.random() - 0.5).join('');
  return `<div class="prompt-label">${t('match')}</div><div class="match-grid"><div class="match-col">${left}</div><div class="match-col">${right}</div></div>`;
}

function renderFooter(ex) {
  const r = state.result;
  if (r) {
    const ok = r === 'correct';
    let ansText = '';
    if (!ok && ex.type !== 'match') ansText = `<div class="feedback-answer">${t('correctAnswer')} <b>${ex.answer || (ex.pairs ? '' : '')}</b></div>`;
    const failCase = !ok && state.hearts <= 0;
    const btn = failCase ? t('retry') : t('cont');
    const action = failCase ? 'fail' : 'cont';
    return `<div class="feedback ${ok ? 'correct-bg' : 'wrong-bg'}"><div class="feedback-msg ${ok ? 'correct' : 'wrong'}">${ok ? t('correct') : t('wrong')}</div>${ansText}<button class="btn btn-primary btn-check" data-action="${action}">${btn}</button></div>`;
  }
  let canCheck = false;
  if (ex.type === 'choice') canCheck = state.selected !== null;
  else if (ex.type === 'translate') canCheck = (state.answer || []).length > 0;
  else if (ex.type === 'input') canCheck = !!state.inputValue;
  else if (ex.type === 'match') canCheck = state.matchMatched.length === ex.pairs.length;
  
  return `<div class="feedback"><button class="btn btn-primary btn-check" data-action="check" ${canCheck ? '' : 'disabled'}>${t('check')}</button></div>`;
}

function bindLesson() {
  const quit = document.querySelector('[data-action="quit"]');
  if (quit) quit.onclick = () => { state.view = 'map'; render(); };

  const inputField = document.getElementById('input-field');
  if (inputField) {
    inputField.oninput = (e) => { state.inputValue = e.target.value; };
    // Автоматическая проверка по Enter
    inputField.onkeydown = (e) => { if (e.key === 'Enter' && state.inputValue) checkAnswer(); };
  }

  document.querySelectorAll('[data-opt]').forEach(b => b.onclick = () => {
    if (!state.result) { state.selected = +b.dataset.opt; render(); }
  });

  document.querySelectorAll('[data-bank]').forEach(b => b.onclick = () => {
    if (state.result) return;
    const ex = state.exercises[state.exIdx];
    const bank = ex.bank || ex.answer.split(' ');
    const i = +b.dataset.bank;
    if ((state.answer || []).some(a => a.i === i)) return;
    state.answer = state.answer || [];
    state.answer.push({ w: bank[i], i });
    render();
  });

  document.querySelectorAll('[data-ans]').forEach(b => b.onclick = () => {
    if (!state.result) { state.answer.splice(+b.dataset.ans, 1); render(); }
  });

  document.querySelectorAll('[data-match]').forEach(b => b.onclick = () => {
    if (state.result) return;
    const i = +b.dataset.match;
    const side = b.dataset.side;
    const ex = state.exercises[state.exIdx];
    
    if (side === 'left') {
      if (state.matchSelected === i) { state.matchSelected = null; render(); }
      else { state.matchSelected = i; render(); }
    } else {
      // Клик по правой колонке
      if (state.matchSelected !== null) {
        // Проверяем пару
        if (state.matchSelected === i) {
          // Правильно
          state.matchMatched.push(i);
          state.matchSelected = null;
          if (state.matchMatched.length === ex.pairs.length) {
             // Все пары собраны - авто-проверка
             checkAnswer();
          } else {
             render();
          }
        } else {
          // Неправильно - звук и сброс
          playSound(false);
          state.matchSelected = null;
          render();
        }
      }
    }
  });

  const check = document.querySelector('[data-action="check"]');
  if (check) check.onclick = checkAnswer;
  const cont = document.querySelector('[data-action="cont"]');
  if (cont) cont.onclick = nextOrFail;
  const fail = document.querySelector('[data-action="fail"]');
  if (fail) fail.onclick = () => { state.failed = true; state.view = 'result'; render(); };
}

function checkAnswer() {
  const ex = state.exercises[state.exIdx];
  let ok = false;
  if (ex.type === 'choice') ok = ex.options[state.selected] === ex.answer;
  else if (ex.type === 'translate') ok = norm((state.answer || []).map(a => a.w).join(' ')) === norm(ex.answer);
  else if (ex.type === 'input') ok = norm(state.inputValue) === norm(ex.answer);
  else if (ex.type === 'match') ok = state.matchMatched.length === ex.pairs.length;

  state.result = ok ? 'correct' : 'wrong';
  playSound(ok);
  if (ok) state.lessonXp += 10; else state.hearts--;
  render();
}

function nextOrFail() {
  if (state.hearts <= 0) { state.failed = true; state.view = 'result'; render(); return; }
  state.exIdx++;
  state.selected = null; state.answer = []; state.inputValue = ''; state.result = null;
  state.matchSelected = null; state.matchMatched = [];
  if (state.exIdx >= state.exercises.length) completeLesson(); else render();
}

function completeLesson() {
  const key = state.lang + '_' + state.unitIdx + '-' + state.lessonIdx;
  const wasDone = !!progress.completed[key];
  progress.completed[key] = true;
  state.xpGained = state.lessonXp + (wasDone ? 0 : 20);
  progress.xp = (progress.xp || 0) + state.xpGained;
  saveProgress();
  state.view = 'result'; state.failed = false; render();
}

function renderResult() {
  if (state.failed) {
    return `<div class="result-screen fail"><img class="mascot" src="${IMAGES.eagle}" alt=""><h1>${t('failTitle')}</h1><p class="result-sub">${t('failSub')}</p><button class="btn btn-primary" data-action="retry" style="width:100%;margin-top:32px">${t('retry')}</button></div>`;
  }
  return `
    <div class="result-screen">
      <img class="mascot" src="${IMAGES.eagle}" alt="">
      <h1>${t('unitDone')}</h1>
      <div class="result-stats">
        <div class="result-stat"><div class="result-stat-label">${t('xp')}</div><div class="result-stat-value">+${state.xpGained}</div></div>
        <div class="result-stat"><div class="result-stat-label">${t('exercises')}</div><div class="result-stat-value">${state.exercises.length}</div></div>
      </div>
      <button class="btn btn-primary" data-action="home" style="width:100%">${t('cont')}</button>
    </div>`;
}
function bindResult() {
  const home = document.querySelector('[data-action="home"]');
  if (home) home.onclick = () => { state.view = 'map'; render(); };
  const retry = document.querySelector('[data-action="retry"]');
  if (retry) retry.onclick = () => startLesson(state.unitIdx, state.lessonIdx);
}

render();
</script>
</body>
</html>
