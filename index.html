<style>
:root {
  --bg: #f7f7f7; --app-bg: #fff; --text: #4b4b4b; --text-muted: #888; --border: #e5e5e5;
  --primary: #c8102e; --primary-dark: #8b0a1f; --primary-light: #fff5f7;
  --success: #58cc02; --success-dark: #4aa800; --success-bg: #ebffdc;
  --error: #ff4b4b; --error-dark: #d03030; --error-bg: #ffecec;
  --gold: #ffc800; --gold-dark: #d1a200; --gold-bg: #fff9e6;
  --shadow: rgba(0,0,0,0.05); --blue: #1cb0f6;
}
[data-theme="dark"] {
  --bg: #131f24; --app-bg: #1a2930; --text: #f1f7fb; --text-muted: #8fa3b0; --border: #37464f;
  --primary: #ff4b4b; --primary-dark: #b52b2b; --primary-light: #2a1a1a;
  --success: #58cc02; --success-dark: #4aa800; --success-bg: #1e3311;
  --error: #ff4b4b; --error-dark: #d03030; --error-bg: #331a1a;
  --gold: #ffc800; --gold-dark: #d1a200; --gold-bg: #2e260a;
  --shadow: rgba(0,0,0,0.3); --blue: #1899d6;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: 'Nunito', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; transition: background 0.3s, color 0.3s; }
.app { max-width: 600px; margin: 0 auto; min-height: 100vh; background: var(--app-bg); box-shadow: 0 0 40px var(--shadow); display: flex; flex-direction: column; }
button { font-family: inherit; }

.lang-screen { padding: 40px 24px; text-align: center; flex: 1; display: flex; flex-direction: column; justify-content: center; }
.mascot { width: 140px; height: 140px; margin: 16px auto 24px; display: block; }
.brand { font-size: 36px; font-weight: 900; color: var(--primary); letter-spacing: -1px; }
.lang-options { display: flex; flex-direction: column; gap: 12px; max-width: 340px; margin: 32px auto 16px; width: 100%; }
.lang-btn { display: flex; align-items: center; gap: 14px; padding: 16px 18px; border: 2px solid var(--border); background: var(--app-bg); border-radius: 16px; font-weight: 700; font-size: 16px; cursor: pointer; box-shadow: 0 4px 0 var(--border); color: var(--text); transition: transform 0.1s; }
.lang-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--border); }
.lang-btn img { width: 38px; border-radius: 4px; }

.top-bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 2px solid var(--border); position: sticky; top: 0; background: var(--app-bg); z-index: 10; }
.top-left { display: flex; align-items: center; gap: 10px; }
.top-center { display: flex; align-items: center; gap: 8px; }
.top-right { display: flex; align-items: center; gap: 10px; }
.brand-small { font-weight: 900; color: var(--primary); font-size: 18px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
.icon-btn { width: 36px; height: 36px; border-radius: 10px; border: 2px solid var(--border); background: var(--app-bg); box-shadow: 0 3px 0 var(--border); cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-muted); transition: transform 0.1s; padding: 0; }
.icon-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--border); }
.icon-btn img { width: 18px; height: 18px; }
.stat { display: flex; align-items: center; gap: 4px; font-weight: 800; color: var(--text-muted); font-size: 15px; }
.stat img { width: 20px; height: 20px; }

.map-screen { padding: 16px; flex: 1; overflow-y: auto; }
.section-header { font-size: 20px; font-weight: 900; color: var(--text); margin: 24px 0 10px; padding: 0 8px; }
.unit-header { color: #fff; padding: 16px 22px; border-radius: 18px; margin: 16px 0 8px; font-weight: 900; font-size: 18px; }
.unit-header small { display: block; font-weight: 700; opacity: 0.8; font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 3px; }
.lessons-path { display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 16px 0 24px; }
.lesson-item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
@media (min-width: 400px) { .lesson-item:nth-child(4n+1) { transform: translateX(-40px); } .lesson-item:nth-child(4n+3) { transform: translateX(40px); } }
.lesson-btn { width: 74px; height: 74px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.1s; color: #fff; }
.lesson-btn:active:not(:disabled) { transform: translateY(3px) !important; }
.lesson-btn.locked { background: var(--border); box-shadow: 0 6px 0 rgba(0,0,0,0.1); cursor: not-allowed; }
.lesson-btn.completed { background: var(--gold); box-shadow: 0 6px 0 var(--gold-dark); }
.lesson-btn.available { cursor: pointer; }
.lesson-label { font-size: 12px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; text-align: center; max-width: 100px; }

.lesson-screen { padding: 16px 20px; min-height: 100vh; display: flex; flex-direction: column; position: relative; }
.lesson-top { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
.progress-bar { flex: 1; height: 16px; background: var(--border); border-radius: 8px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--gold); transition: width 0.35s; border-radius: 8px; }
.close-btn { background: none; border: none; font-size: 26px; cursor: pointer; color: var(--text-muted); padding: 0 8px; }
.lesson-content { flex: 1; z-index: 2; }
.mascot-lesson { position: fixed; bottom: 80px; right: 20px; width: 80px; height: 80px; opacity: 0.15; pointer-events: none; z-index: 1; }

.prompt-label { font-size: 12px; text-transform: uppercase; color: var(--text-muted); font-weight: 800; letter-spacing: 1.2px; margin-bottom: 12px; }
.prompt-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.prompt { font-size: 26px; font-weight: 900; color: var(--text); }
.tts-btn { background: none; border: none; cursor: pointer; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; opacity: 0.7; padding: 0;}
.tts-btn:hover { opacity: 1; }
.tts-btn img { width: 100%; height: 100%; }

.options { display: flex; flex-direction: column; gap: 12px; margin: 20px 0; }
.option-btn { padding: 16px 20px; border: 2px solid var(--border); background: var(--app-bg); border-radius: 14px; text-align: left; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 3px 0 var(--border); color: var(--text); transition: transform 0.08s; }
.option-btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--border); }
.option-btn.selected { border-color: var(--primary); background: var(--primary-light); color: var(--primary); box-shadow: 0 3px 0 var(--primary); }
.option-btn.correct { border-color: var(--success); background: var(--success-bg); color: var(--success-dark); box-shadow: 0 3px 0 var(--success); }
.option-btn.wrong { border-color: var(--error); background: var(--error-bg); color: var(--error-dark); box-shadow: 0 3px 0 var(--error); }

.translate-area { min-height: 90px; border-bottom: 2px solid var(--border); padding: 10px 0; display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
.bank { display: flex; flex-wrap: wrap; gap: 8px; }
.word-btn { padding: 10px 16px; border: 2px solid var(--border); background: var(--app-bg); border-radius: 12px; font-weight: 700; font-size: 16px; cursor: pointer; box-shadow: 0 3px 0 var(--border); color: var(--text); }
.word-btn.used { opacity: 0.25; pointer-events: none; box-shadow: none; }
.word-btn.in-answer { border-color: var(--primary); color: var(--primary); background: var(--primary-light); box-shadow: 0 3px 0 var(--primary); }

.match-grid { display: flex; gap: 16px; margin: 20px 0; }
.match-col { flex: 1; display: flex; flex-direction: column; gap: 10px; }
.match-btn { padding: 14px 16px; border: 2px solid var(--border); background: var(--app-bg); border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; box-shadow: 0 3px 0 var(--border); color: var(--text); text-align: center; }
.match-btn.selected { border-color: var(--primary); background: var(--primary-light); color: var(--primary); box-shadow: 0 3px 0 var(--primary); }
.match-btn.matched { border-color: var(--success); background: var(--success-bg); color: var(--success-dark); box-shadow: 0 3px 0 var(--success); opacity: 0.5; pointer-events: none; }

.feedback { padding: 16px 20px; border-top: 2px solid var(--border); background: var(--app-bg); position: sticky; bottom: 0; margin: 20px -20px -16px; z-index: 3; }
.feedback.correct-bg { background: var(--success-bg); border-top-color: var(--success); }
.feedback.wrong-bg { background: var(--error-bg); border-top-color: var(--error); }
.feedback-msg { font-weight: 900; font-size: 20px; margin-bottom: 8px; }
.feedback-msg.correct { color: var(--success-dark); }
.feedback-msg.wrong { color: var(--error-dark); }
.btn { padding: 14px 24px; border-radius: 14px; border: none; font-weight: 900; font-size: 15px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
.btn:active:not(:disabled) { transform: translateY(2px); }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: #fff; box-shadow: 0 4px 0 var(--primary-dark); }
.btn-secondary { background: var(--app-bg); color: var(--primary); border: 2px solid var(--border); box-shadow: 0 4px 0 var(--border); }
.btn-check { width: 100%; }

.result-screen { padding: 48px 24px; text-align: center; flex: 1; display: flex; flex-direction: column; justify-content: center; }
.result-screen h1 { font-size: 30px; color: var(--gold); margin: 8px 0 16px; }
.result-sub { color: var(--text-muted); font-weight: 600; }
.result-stats { display: flex; justify-content: center; gap: 20px; margin: 28px 0; }
.result-stat { flex: 1; max-width: 130px; padding: 18px 10px; border-radius: 16px; background: var(--bg); border: 2px solid var(--gold); }
.result-stat-label { font-size: 11px; color: var(--text-muted); font-weight: 800; text-transform: uppercase; margin-bottom: 6px; }
.result-stat-value { font-size: 26px; font-weight: 900; color: var(--gold-dark); }

.page-screen { padding: 20px; flex: 1; overflow-y: auto; }
.page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.page-title { font-size: 26px; font-weight: 900; }
.news-card { background: var(--app-bg); border: 2px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 16px; box-shadow: 0 4px 0 var(--border); }
.news-topic { font-size: 11px; font-weight: 800; color: var(--primary); text-transform: uppercase; margin-bottom: 6px; }
.news-title { font-size: 18px; font-weight: 900; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.news-text { font-size: 15px; font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.news-trans { font-size: 14px; color: var(--text-muted); font-style: italic; border-left: 3px solid var(--border); padding-left: 10px; margin-top: 8px; }
.shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.shop-item { background: var(--app-bg); border: 2px solid var(--border); border-radius: 16px; padding: 16px; text-align: center; box-shadow: 0 4px 0 var(--border); }
.shop-item.equipped { border-color: var(--success); background: var(--success-bg); }
.shop-title { font-weight: 900; font-size: 16px; margin: 10px 0 4px; }
.shop-price { font-weight: 800; color: var(--gold-dark); font-size: 14px; display: flex; justify-content: center; align-items: center; gap: 4px; }
.shop-price img { width: 16px; }
.shop-btn { margin-top: 10px; width: 100%; padding: 10px; font-size: 14px; }
</style>
</head>

    const base = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><circle cx='100' cy='115' r='72' fill='#fff' stroke='#c8102e' stroke-width='5'/><path d='M 55 62 L 68 28 L 84 50 L 100 20 L 116 50 L 132 28 L 145 62 Z' fill='#f5c842' stroke='#c8102e' stroke-width='3.5' stroke-linejoin='round'/><ellipse cx='78' cy='105' rx='10' ry='12' fill='#1a1a1a'/><ellipse cx='122' cy='105' rx='10' ry='12' fill='#1a1a1a'/><circle cx='81' cy='101' r='3.5' fill='#fff'/><circle cx='125' cy='101' r='3.5' fill='#fff'/><path d='M 86 128 L 100 158 L 114 128 Z' fill='#f5c842' stroke='#c8102e' stroke-width='3' stroke-linejoin='round'/><circle cx='58' cy='125' r='9' fill='#ffb3b3' opacity='0.55'/><circle cx='142' cy='125' r='9' fill='#ffb3b3' opacity='0.55'/>${overlay}</svg>`;
    return "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(base)));
}

const state = {
  lang: progress.lang || null,
  view: progress.lang ? 'map' : 'lang',
  unitIdx: 0, lessonIdx: 0, sectionIdx: 0,
  exercises: [], exIdx: 0, hearts: 5, lessonXp: 0, xpGained: 0, failed: false,
  selected: null, answer: [], result: null,
  matchSelected: null, matchMatched: [],
  currentOptions: [], matchRightOrder: []
};

// НАДЕЖНЫЙ TTS
function speak(text) {
    let plVoice = null;
    if ('speechSynthesis' in window) {
        const voices = window.speechSynthesis.getVoices();
        plVoice = voices.find(v => (v.lang === 'pl-PL' || v.lang.startsWith('pl')) && !v.name.includes('Irina') && !v.lang.startsWith('ru'));
    }
    
    if (plVoice) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.voice = plVoice;
        msg.lang = 'pl-PL';
        msg.rate = 0.9;
        window.speechSynthesis.speak(msg);
    } else {
        // Если в системе нет польского голоса, используем API StreamElements (без блокировок CORS)
        const url = `https://api.streamelements.com/kappa/v2/speech?voice=pl-PL-Standard-A&text=${encodeURIComponent(text)}`;
        const audio = new Audio(url);
        audio.play().catch(e => {
            console.log('TTS Error:', e);
            // Дополнительный фоллбэк через Google Translate (если StreamElements упадет)
            const gtUrl = `https://translate.google.com/translate_tts?ie=UTF-8&tl=pl&client=tw-ob&q=${encodeURIComponent(text)}`;
            new Audio(gtUrl).play().catch(err => console.log('Fallback TTS Error:', err));
        });
    }
}

function t(k) {
  const texts = {
    ru: { check: 'Проверить', cont: 'Продолжить', retry: 'Повторить', correct: 'Отлично!', wrong: 'Ошибка', unitDone: 'Урок пройден!', xp: 'Опыт', failTitle: 'Не сдавайся!', failSub: 'Попробуй ещё раз' },
    en: { check: 'Check', cont: 'Continue', retry: 'Retry', correct: 'Great!', wrong: 'Wrong', unitDone: 'Lesson complete!', xp: 'XP', failTitle: 'Keep trying!', failSub: 'Try again' }
  };
  return texts[state.lang || 'ru'][k] || k;
}

function saveProgress() { localStorage.setItem('polsking', JSON.stringify(progress)); }
function norm(s) { return s.toLowerCase().replace(/[.,!?;:'"„”«»()]/g, '').replace(/\s+/g, ' ').trim(); }
function shuffleArray(arr) { return [...arr].sort(() => Math.random() - 0.5); }
function playSound(ok) { const a = document.getElementById(ok ? 'sfx-apply' : 'sfx-deny'); if(a) { a.currentTime=0; a.play().catch(()=>{}); } }
function applyTheme() { document.documentElement.setAttribute('data-theme', progress.theme || 'light'); }

function checkStreak() {
    const today = new Date().toISOString().split('T')[0];
    if (progress.lastPlayed === today) return;
    if (progress.lastPlayed) {
        const d1 = new Date(today); const d2 = new Date(progress.lastPlayed);
        const diff = (d1 - d2) / (1000 * 60 * 60 * 24);
        if (diff === 1) progress.streak++;
        else if (diff > 1) progress.streak = 1;
    } else {
        progress.streak = 1;
    }
    progress.lastPlayed = today;
    saveProgress();
}

/* ══════════════════ РЕНДЕР ══════════════════ */
function render() {
  applyTheme();
  const el = document.getElementById('app');
  if (state.view === 'lang') { el.innerHTML = renderLang(); bindLang(); }
  else if (state.view === 'map') { el.innerHTML = renderMap(); bindMap(); }
  else if (state.view === 'lesson') { el.innerHTML = renderLesson(); bindLesson(); }
  else if (state.view === 'result') { el.innerHTML = renderResult(); bindResult(); }
  else if (state.view === 'news') { el.innerHTML = renderNews(); bindGlobal(); }
  else if (state.view === 'shop') { el.innerHTML = renderShop(); bindShop(); }
}

function renderTopBar() {
  const backBtn = state.view !== 'map' ? `<button class="icon-btn" onclick="goView('map')"><img src="${IMAGES.back_icon}"></button>` : '';
  return `
    <div class="top-bar">
      <div class="top-left">
        ${backBtn}
        <div class="brand-small" onclick="goView('map')">Polsking</div>
      </div>
      <div class="top-center">
        <button class="icon-btn" onclick="goView('news')"><img src="${IMAGES.news_icon}"></button>
        <button class="icon-btn" onclick="goView('shop')"><img src="${IMAGES.shop_icon}"></button>
        <button class="icon-btn" onclick="toggleTheme()">${progress.theme === 'dark' ? '☀️' : '🌙'}</button>
      </div>
      <div class="top-right">
        <div class="stat"><img src="${IMAGES.flame}">${progress.streak}</div>
        <div class="stat"><img src="${IMAGES.star}">${progress.xp}</div>
      </div>
    </div>`;
}

function renderLang() {
  return `
    <div class="lang-screen">
      <img class="mascot" src="${getMascot()}" alt="Polsking">
      <h1 class="brand">Polsking</h1>
      <div class="lang-options">
        <button class="lang-btn" data-lang="ru"><img src="${IMAGES.flag_ru}">Я говорю по-русски</button>
        <button class="lang-btn" data-lang="en"><img src="${IMAGES.flag_gb}">I speak English</button>
      </div>
    </div>`;
}
function bindLang() {
  document.querySelectorAll('.lang-btn').forEach(b => b.onclick = () => {
    state.lang = b.dataset.lang; progress.lang = state.lang; saveProgress(); goView('map');
  });
}

function renderMap() {
  const course = COURSES[state.lang];
  let html = renderTopBar() + `<div class="map-screen">`;
  
  course.sections.forEach((section, si) => {
    html += `<div class="section-header">${section.title}</div>`;
    section.units.forEach((unit, ui) => {
      const color = [{bg:'#c8102e',s:'#8b0a1f'},{bg:'#1cb0f6',s:'#1899d6'},{bg:'#58cc02',s:'#46a302'},{bg:'#ce82ff',s:'#a568cc'},{bg:'#ff9600',s:'#cc7800'}][ui % 5];
      html += `<div class="unit-header" style="background:linear-gradient(135deg,${color.bg},${color.s});box-shadow:0 4px 0 ${color.s}"><small>Блок ${si+1}.${ui+1}</small>${unit.title}</div>`;
      html += `<div class="lessons-path">`;
      
      unit.lessons.forEach((lesson, li) => {
        const key = `${state.lang}_${si}_${ui}_${li}`;
        const count = progress.completed[key] || 0;
        const unlocked = isUnlocked(si, ui, li);
        
        let cls = 'lesson-btn', inner = '', btnStyle = '';
        if (count > 0) {
          cls += ' completed';
          inner = `<span style="font-size:32px;color:#fff;font-weight:900">✓</span>`;
        } else if (unlocked) {
          cls += ' available';
          btnStyle = `background:${color.bg}; box-shadow:0 6px 0 ${color.s}`;
          inner = `<span style="font-size:30px;color:#fff;font-weight:900">▶</span>`;
        } else {
          cls += ' locked'; inner = `🔒`;
        }
        const stars = count > 0 ? `<div style="font-size:10px;color:var(--gold-dark);margin-top:2px">${'★'.repeat(Math.min(count, 3))}</div>` : '';
        
        html += `<div class="lesson-item">
          <button class="${cls}" style="${btnStyle}" data-si="${si}" data-u="${ui}" data-l="${li}" ${unlocked ? '' : 'disabled'}>${inner}</button>
          <div class="lesson-label">${lesson.title}</div>${stars}
        </div>`;
      });
      html += `</div>`;
    });
  });
  return html + `</div>`;
}

function isUnlocked(si, ui, li) {
  if (si === 0 && ui === 0 && li === 0) return true;
  const key = (s, u, l) => `${state.lang}_${s}_${u}_${l}`;
  if (li > 0) return !!progress.completed[key(si, ui, li - 1)];
  if (ui > 0) return !!progress.completed[key(si, ui - 1, COURSES[state.lang].sections[si].units[ui - 1].lessons.length - 1)];
  if (si > 0) {
    const prevSec = COURSES[state.lang].sections[si - 1];
    const lastUnit = prevSec.units[prevSec.units.length - 1];
    return !!progress.completed[key(si - 1, prevSec.units.length - 1, lastUnit.lessons.length - 1)];
  }
  return false;
}
function bindMap() {
  document.querySelectorAll('.lesson-btn[data-si]').forEach(b => {
    if (!b.disabled) b.onclick = () => startLesson(+b.dataset.si, +b.dataset.u, +b.dataset.l);
  });
}

function startLesson(si, ui, li) {
  state.sectionIdx = si; state.unitIdx = ui; state.lessonIdx = li;
  state.exercises = COURSES[state.lang].sections[si].units[ui].lessons[li].exercises;
  state.exIdx = 0; state.hearts = 5; state.lessonXp = 0; state.xpGained = 0; state.failed = false;
  prepareExercise(); goView('lesson');
}

function prepareExercise() {
  const ex = state.exercises[state.exIdx];
  state.selected = null; state.answer = []; state.result = null;
  state.matchSelected = null; state.matchMatched = [];
  if (ex.type === 'choice') state.currentOptions = shuffleArray(ex.options.map(o => ({ text: o, isCorrect: o === ex.answer })));
  else if (ex.type === 'match') state.matchRightOrder = shuffleArray(ex.pairs.map((_, i) => i));
}

function renderLesson() {
  const ex = state.exercises[state.exIdx];
  const pct = (state.exIdx / state.exercises.length) * 100;
  let body = '';
  if (ex.type === 'choice') body = renderChoice(ex);
  else if (ex.type === 'translate') body = renderTranslate(ex);
  else if (ex.type === 'match') body = renderMatch(ex);
  
  return `
    <div class="lesson-screen">
      <img class="mascot-lesson" src="${getMascot()}">
      <div class="lesson-top">
        <button class="close-btn" onclick="goView('map')">✕</button>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="stat"><img src="${IMAGES.heart}">${state.hearts}</div>
      </div>
      <div class="lesson-content">${body}</div>
      ${renderFooter(ex)}
    </div>`;
}

function renderChoice(ex) {
  const r = state.result, sel = state.selected;
  const opts = state.currentOptions.map((o, i) => {
    let cls = 'option-btn';
    if (r) { if (o.isCorrect) cls += ' correct'; else if (i === sel) cls += ' wrong'; }
    else if (i === sel) cls += ' selected';
    return `<button class="${cls}" data-opt="${i}" ${r?'disabled':''}>${o.text}</button>`;
  }).join('');
  return `<div class="prompt-label">Выбери перевод</div>
    <div class="prompt-row"><div class="prompt">${ex.prompt}</div>
    <button class="tts-btn" onclick="speak('${ex.prompt}')"><img src="${IMAGES.speaker}"></button></div>
    <div class="options">${opts}</div>`;
}

function renderTranslate(ex) {
  const r = state.result, ans = state.answer || [];
  const bank = ex.bank || ex.answer.split(' ');
  const used = new Set(ans.map(a => a.i));
  const ansHtml = ans.map((a, ai) => `<button class="word-btn in-answer" data-ans="${ai}" ${r?'disabled':''}>${a.w}</button>`).join('');
  const bankHtml = bank.map((w, i) => `<button class="word-btn ${used.has(i)?'used':''}" data-bank="${i}" ${r?'disabled':''}>${w}</button>`).join('');
  
  return `<div class="prompt-label">Переведи на польский</div>
    <div class="prompt-row"><div class="prompt">${ex.prompt}</div></div>
    <div class="translate-area">${ansHtml}</div><div class="bank">${bankHtml}</div>`;
}

function renderMatch(ex) {
  const r = state.result;
  const left = ex.pairs.map((p, i) => {
    let cls = state.matchMatched.includes(i) ? 'match-btn matched' : (state.matchSelected === i ? 'match-btn selected' : 'match-btn');
    return `<button class="${cls}" data-match="${i}" data-side="left" ${r?'disabled':''}>${p[0]}</button>`;
  }).join('');
  const right = state.matchRightOrder.map(i => {
    const cls = state.matchMatched.includes(i) ? 'match-btn matched' : 'match-btn';
    return `<button class="${cls}" data-match="${i}" data-side="right" ${r?'disabled':''}>${ex.pairs[i][1]}</button>`;
  }).join('');
  return `<div class="prompt-label">Соедини пары</div><div class="match-grid"><div class="match-col">${left}</div><div class="match-col">${right}</div></div>`;
}

function renderFooter(ex) {
  const r = state.result;
  if (r) {
    const ok = r === 'correct';
    return `<div class="feedback ${ok?'correct-bg':'wrong-bg'}">
      <div class="feedback-msg ${ok?'correct':'wrong'}">${ok?t('correct'):t('wrong')}</div>
      <button class="btn btn-primary btn-check" onclick="nextOrFail()">${t('cont')}</button></div>`;
  }
  let canCheck = false;
  if (ex.type === 'choice') canCheck = state.selected !== null;
  else if (ex.type === 'translate') canCheck = (state.answer || []).length > 0;
  else if (ex.type === 'match') canCheck = state.matchMatched.length === ex.pairs.length;
  return `<div class="feedback"><button class="btn btn-primary btn-check" onclick="checkAnswer()" ${canCheck?'':'disabled'}>${t('check')}</button></div>`;
}

function bindLesson() {
  document.querySelectorAll('[data-opt]').forEach(b => b.onclick = () => { if(!state.result) { state.selected = +b.dataset.opt; render(); } });
  document.querySelectorAll('[data-bank]').forEach(b => b.onclick = () => {
    if (state.result) return;
    const i = +b.dataset.bank, ex = state.exercises[state.exIdx], bank = ex.bank || ex.answer.split(' ');
    if ((state.answer||[]).some(a => a.i === i)) return;
    state.answer.push({ w: bank[i], i }); render();
  });
  document.querySelectorAll('[data-ans]').forEach(b => b.onclick = () => { if(!state.result) { state.answer.splice(+b.dataset.ans, 1); render(); } });
  
  document.querySelectorAll('[data-match]').forEach(b => b.onclick = () => {
    if (state.result) return;
    const i = +b.dataset.match, side = b.dataset.side;
    if (side === 'left') { state.matchSelected = state.matchSelected === i ? null : i; render(); }
    else if (state.matchSelected !== null) {
      if (state.matchSelected === i) { state.matchMatched.push(i); state.matchSelected = null; render(); }
      else { playSound(false); state.matchSelected = null; render(); }
    }
  });
}

function checkAnswer() {
  const ex = state.exercises[state.exIdx];
  let ok = false;
  if (ex.type === 'choice') ok = state.currentOptions[state.selected].isCorrect;
  else if (ex.type === 'translate') ok = norm((state.answer||[]).map(a=>a.w).join(' ')) === norm(ex.answer);
  else if (ex.type === 'match') ok = state.matchMatched.length === ex.pairs.length;
  
  state.result = ok ? 'correct' : 'wrong';
  playSound(ok);
  if (ok) state.lessonXp += 10; else state.hearts--;
  render();
}

function nextOrFail() {
  if (state.hearts <= 0) { state.failed = true; goView('result'); return; }
  state.exIdx++;
  if (state.exIdx >= state.exercises.length) completeLesson();
  else { prepareExercise(); render(); }
}

function completeLesson() {
  const key = `${state.lang}_${state.sectionIdx}_${state.unitIdx}_${state.lessonIdx}`;
  const count = progress.completed[key] || 0;
  
  if (count < 3) {
    state.xpGained = state.lessonXp + 10;
    progress.xp += state.xpGained;
    progress.completed[key] = count + 1;
  } else {
    state.xpGained = 0;
  }
  
  saveProgress();
  goView('result');
}

function renderResult() {
  if (state.failed) {
    return `<div class="result-screen"><img class="mascot" src="${getMascot()}">
      <h1 style="color:var(--primary)">${t('failTitle')}</h1><p class="result-sub">${t('failSub')}</p>
      <button class="btn btn-primary" onclick="startLesson(${state.sectionIdx},${state.unitIdx},${state.lessonIdx})" style="margin-top:32px">${t('retry')}</button></div>`;
  }
  const msg = state.xpGained > 0 ? `+${state.xpGained} XP` : "Практика пройдена!";
  return `<div class="result-screen"><img class="mascot" src="${getMascot()}">
    <h1>${t('unitDone')}</h1>
    <div class="result-stats"><div class="result-stat"><div class="result-stat-label">Опыт</div><div class="result-stat-value">${msg}</div></div></div>
    <button class="btn btn-primary" onclick="goView('map')" style="width:100%">${t('cont')}</button></div>`;
}

function bindResult() {}

function renderNews() {
  let html = renderTopBar() + `<div class="page-screen">
    <div class="page-header">
      <div class="page-title">Новости</div>
      <button class="btn btn-secondary" style="padding:8px 12px;font-size:12px" onclick="refreshNews()">🔄 Обновить</button>
    </div>`;
  
  const news = NEWS_DATA[state.lang] || NEWS_DATA['ru'];
  news.forEach(n => {
    html += `<div class="news-card">
      <div class="news-topic">${n.topic}</div>
      <div class="news-title">${n.title} <button class="tts-btn" onclick="speak('${n.title}')"><img src="${IMAGES.speaker}"></button></div>
      <div class="news-text">${n.text} <button class="tts-btn" onclick="speak('${n.text}')"><img src="${IMAGES.speaker}"></button></div>
      <div class="news-trans">${n.trans}</div>
    </div>`;
  });
  return html + `</div>`;
}
function refreshNews() {
  NEWS_DATA[state.lang] = shuffleArray(NEWS_DATA[state.lang]);
  render();
}

function renderShop() {
  let html = renderTopBar() + `<div class="page-screen"><div class="page-title">Магазин</div>`;
  html += `<div style="text-align:center;margin-bottom:20px"><img src="${getMascot()}" style="width:100px"></div>`;
  html += `<div class="shop-grid">`;
  SHOP_ITEMS.forEach(item => {
    const owned = progress.owned.includes(item.id);
    const equipped = progress.equipped === item.id;
    html += `<div class="shop-item ${equipped?'equipped':''}">
      <div class="shop-title">${item.name}</div>
      <div class="shop-price"><img src="${IMAGES.star}">${item.price}</div>
      <button class="btn ${owned?'btn-secondary':'btn-primary'} shop-btn" onclick="${owned ? `equip('${item.id}')` : `buy('${item.id}')`}">
        ${owned ? (equipped ? 'Снять' : 'Надеть') : 'Купить'}
      </button>
    </div>`;
  });
  return html + `</div></div>`;
}

function bindShop() {}

function buy(id) {
  const item = SHOP_ITEMS.find(i => i.id === id);
  if (progress.xp >= item.price && !progress.owned.includes(id)) {
    progress.xp -= item.price; progress.owned.push(id); progress.equipped = id;
    saveProgress(); goView('shop');
  }
}
function equip(id) {
  progress.equipped = progress.equipped === id ? 'none' : id;
  saveProgress(); goView('shop');
}

function goView(view) { state.view = view; render(); }
function toggleTheme() { progress.theme = progress.theme === 'dark' ? 'light' : 'dark'; saveProgress(); render(); }

checkStreak();
if ('speechSynthesis' in window) { window.speechSynthesis.getVoices(); }
render();
</script>
</body>
</html>
